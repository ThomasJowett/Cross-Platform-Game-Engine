site_name: Cross-Platform Game Engine
site_description: Documentation and Lua API reference for the engine.
# Assumes the default GitHub Pages URL for this repo - update if a custom domain is set up.
site_url: https://thomasjowett.github.io/Cross-Platform-Game-Engine/

# docs/ is hand-written (index.md, getting-started.md, ...) - edit those directly. Only
# docs/LuaAPI/ is generated (by Editor's --generate-docs flag / the GenerateLuaDocs CMake
# target - see Editor/src/FileSystem/LuaDocGenerator.cpp); don't hand-edit anything under
# there, it's overwritten on every regeneration. Component pages (docs/Components/) are
# hand-written and include their generated Lua section from docs/LuaAPI/_fragments/.
docs_dir: docs

# Fragments are only ever included into other pages, never rendered on their own.
exclude_docs: |
  LuaAPI/_fragments/

# No explicit nav: the Lua API's component list changes as more components adopt the
# REFLECT_LUA_* macros, so navigation is left to MkDocs' automatic file-tree nav. The order
# of the hand-written pages is set in docs/.pages (awesome-pages plugin); "..." picks up the rest.

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
